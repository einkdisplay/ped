[package]
name = "ped"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "ped"
path = "src/main.rs"

[[bin]]
name = "ped-cli"
path = "src/bin/ped-cli.rs"

[dependencies]
# Servo's software context uses dpi sizes directly.
dpi = "0.1"
embedder_traits = { package = "servo-embedder-traits", git = "https://github.com/einkdisplay/servo", branch = "kindle-fontconfigless" }
fbink-sys = { path = "../fbink-sys" }
libc = "0.2"
rand_core = "0.9"
rand_jitter = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servo = { git = "https://github.com/einkdisplay/servo", branch = "kindle-fontconfigless", default-features = false, features = ["bundled", "js_jit"] }
servo-base = { package = "servo-base", git = "https://github.com/einkdisplay/servo", branch = "kindle-fontconfigless" }
fontconfig_sys = { package = "yeslogic-fontconfig-sys", version = "6", features = ["dlopen"] }
toml = "0.9"
url = "2"
