[package]
name = "ped"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Servo's software context uses dpi sizes directly.
dpi = "0.1"
embedder_traits = { package = "servo-embedder-traits", path = "../servo/components/shared/embedder" }
fbink-sys = { path = "fbink-sys" }
libc = "0.2"
rand_core = "0.9"
rand_jitter = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servo = { path = "../servo/components/servo", default-features = false, features = ["bundled", "js_jit"] }
servo-base = { path = "../servo/components/shared/base" }
fontconfig_sys = { package = "yeslogic-fontconfig-sys", version = "6", features = ["dlopen"] }
toml = "0.9"
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[patch.crates-io]
freetype-sys = { path = "vendor/freetype-sys" }
mozjs_sys = { path = "../mozjs/mozjs-sys" }
surfman = { path = "vendor/surfman" }

